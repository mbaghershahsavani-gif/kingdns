services:
  postgres:
    image: postgres:16
    container_name: kingdns-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kingdns
      POSTGRES_USER: kingdns
      POSTGRES_PASSWORD: kingdns_dev_password
    ports:
      - "5432:5432"
    volumes:
      - kingdns_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: kingdns-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  prometheus:
    image: prom/prometheus:latest
    container_name: kingdns-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: kingdns-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  kingdns_postgres_data:
